<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#166666" />
    <title>Offline · Wispex</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a;
             min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
      .card { max-width: 380px; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px; text-align: center; }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 18px; margin: 16px 0 8px; letter-spacing: .04em; }
      p { color: #475569; font-size: 14px; line-height: 1.5; }
      button { margin-top: 12px; background: #166666; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>OFFLINE MODE</h1>
      <p>Your connection is unavailable. Task data is not stored on this device, so nothing can be viewed or changed until the connection returns.</p>
      <p>Nothing you submitted has been lost or marked as completed.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
