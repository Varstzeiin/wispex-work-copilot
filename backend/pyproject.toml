# Used by Vercel only: it installs these dependencies and starts `index:app`.
# Other hosts and local setup use requirements.txt. tests/test_deployment.py keeps both lists equal.
[project]
name = "wispex-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.54",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "pyjwt==2.10.1",
    "cryptography==46.0.3",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.13",
    "python-multipart==0.0.32",
    "anthropic==1.8.0",
    "pypdf==6.19.0",
]

[tool.uv]
package = false  # an app, not a library: nothing to build

[tool.vercel]
entrypoint = "index:app"
